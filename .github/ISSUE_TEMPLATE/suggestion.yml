name: Suggestion
description: Suggest an improvement or describe a reproducible behavior problem.
title: "[Suggestion] "
labels: [suggestion]
body:
  - type: textarea
    id: change
    attributes:
      label: Suggested change or observed problem
      description: Include current behavior, expected result and steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup and evidence
      description: Release, UI version, physical client size/DPI, modifiers and last stop reason. Redact personal data.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets, usernames and private captures from this report.
          required: true
